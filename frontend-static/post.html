<body>
<div id="navbar-mount"></div>

<main>
  <article class="sec" style="border-top:0">
    <div class="wrap" style="max-width:46rem">
      <a class="link" href="blog.html">Voltar ao blog</a>
      <header id="post-header" style="margin-top:1.5rem"><div class="skeleton" style="height:2.5rem;width:80%"></div></header>
      <div class="prose" id="post-content" style="margin-top:2rem"></div>
      <ul class="tags" id="post-tags" style="margin-top:2rem"></ul>

      <section id="comentarios" class="hidden" style="margin-top:3.5rem;padding-top:2rem;border-top:1px solid var(--line)">
        <h2 id="comments-heading" style="font-size:1.35rem">Comentários</h2>
        <form class="form" id="comment-form" novalidate style="margin-top:1.25rem">
          <div class="form-row">
            <div><label for="c-name">Nome</label><input class="input" id="c-name" name="name" required minlength="2" maxlength="100"></div>
            <div><label for="c-email">Email (não é publicado)</label><input class="input" id="c-email" name="email" type="email" required maxlength="254"></div>
          </div>
          <div><label for="c-content">Comentário</label><textarea class="input" id="c-content" name="content" required minlength="3" maxlength="1000" rows="3"></textarea></div>
          <div><button class="btn" type="submit" id="comment-submit">Publicar comentário</button></div>
          <p class="feedback" id="comment-feedback" role="status"></p>
        </form>
        <div id="comments-list" style="margin-top:2rem;display:grid;gap:1.5rem"></div>
      </section>
    </div>
  </article>
</main>
